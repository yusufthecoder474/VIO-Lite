name: VIO-Lite — C++ and synthetic smoke CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake libopencv-dev libeigen3-dev
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Configure and build C++
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
      - name: Run CTest
        run: ctest --test-dir build --output-on-failure
      - name: Run Python evaluation tests
        run: python scripts/test_evaluation.py -v
      - name: Run synthetic demonstration (NOT EuRoC)
        env:
          MPLBACKEND: Agg
        run: python scripts/run_project.py --skip-build --output output-smoke
      - name: Upload synthetic smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vio-synthetic-smoke-${{ github.run_number }}
          path: output-smoke/
          if-no-files-found: ignore
          retention-days: 7
